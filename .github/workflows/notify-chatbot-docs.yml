name: Notify chatbot of doc changes

# The chatbot keeps its own knowledge base (docs/*.md in the chatbot repo)
# describing how this app works. Nothing enforces that the two stay in step, so
# when the user-facing documentation here changes, tell the chatbot repo to go
# review its copy for drift.
#
# This deliberately does not try to sync content automatically: the user manual
# lives inside a React component as JSX, not as prose, so any extractor would be
# guesswork. A human reviews; CI only makes sure nobody forgets to.

on:
  push:
    branches: [main]
    paths:
      - 'LivingAtlas1-main/client/src/UserManual.js'
      - 'LivingAtlas1-main/client/src/ChangelogHistory.js'
      - 'LivingAtlas1-main/client/src/ChangelogModal.js'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit to diff against.
          fetch-depth: 2

      - name: Collect what changed
        id: changes
        run: |
          # A force-push or first push leaves no usable "before" ref; fall back
          # to the path filter's own list rather than failing the run.
          if git rev-parse --verify --quiet "${GITHUB_SHA}^" >/dev/null; then
            files=$(git diff --name-only "${GITHUB_SHA}^" "${GITHUB_SHA}" \
                    -- 'LivingAtlas1-main/client/src/UserManual.js' \
                       'LivingAtlas1-main/client/src/ChangelogHistory.js' \
                       'LivingAtlas1-main/client/src/ChangelogModal.js')
          else
            files='(could not diff — check the commit directly)'
          fi
          {
            echo 'files<<CHANGED_FILES_EOF'
            echo "${files:-(none detected)}"
            echo 'CHANGED_FILES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tell the chatbot repo
        env:
          GH_TOKEN: ${{ secrets.CHATBOT_DISPATCH_TOKEN }}
          CHATBOT_REPO: ${{ vars.CHATBOT_REPO }}
          # Passed through the environment, never interpolated into the script:
          # a commit message is attacker-controllable text and `${{ }}` inside a
          # run block is substituted before the shell parses it.
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$CHATBOT_REPO" ]; then
            echo "::warning::CHATBOT_DISPATCH_TOKEN secret or CHATBOT_REPO variable is not set; skipping notification."
            exit 0
          fi

          jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg message "$COMMIT_MESSAGE" \
            --arg url "$COMMIT_URL" \
            --arg author "$COMMIT_AUTHOR" \
            --arg files "$CHANGED_FILES" \
            '{
               event_type: "atlas-docs-changed",
               client_payload: {
                 sha: $sha,
                 message: $message,
                 url: $url,
                 author: $author,
                 files: $files
               }
             }' \
            | gh api "repos/${CHATBOT_REPO}/dispatches" --input -

          echo "Notified ${CHATBOT_REPO} about ${COMMIT_SHA}." >> "$GITHUB_STEP_SUMMARY"
