name: Validate and sync published user manual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-manual-publish
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LivingAtlas1-main/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: LivingAtlas1-main/client/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/export-manual.test.cjs
      - run: npm test -- --watchAll=false --runInBand --runTestsByPath src/UserManual.test.js src/manual/ManualText.test.js src/manual/ManualSources.test.js src/ChatbotWidget.sources.test.js src/Changelog.test.js
        env:
          CI: 'true'
      - run: npm run build
        env:
          CI: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: published-manual-candidate
          path: LivingAtlas1-main/client/public/manual/current.json
          if-no-files-found: error

  notify:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: published-manual-candidate
          path: candidate
      - name: Wait for the exact deployed app manual and dispatch sync
        env:
          ATLAS_MANUAL_BASE_URL: ${{ vars.ATLAS_MANUAL_BASE_URL }}
          CHATBOT_REPO: ${{ vars.CHATBOT_REPO }}
          GH_TOKEN: ${{ secrets.CHATBOT_DISPATCH_TOKEN }}
        run: python scripts/notify-manual-release.py --manifest candidate/current.json
