name: Deploy backend to Azure - rwc-atlas-api

on:
  push:
    branches: [main]
    paths:
      - 'LivingAtlas1-main/backend/**'
      - '.github/workflows/main_rwc-atlas-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-rwc-atlas-api
  cancel-in-progress: false

jobs:
  deploy:
    # The Azure federated credential must trust main, not a PR or feature branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: LivingAtlas1-main/backend/requirements.txt

      - name: Verify backend dependencies
        working-directory: LivingAtlas1-main/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Package backend source
        # Archive the subtree so main.py and requirements.txt are at ZIP root.
        # Only committed source is included; runner environments are excluded.
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/atlas-api.zip" HEAD:LivingAtlas1-main/backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_36AC34D2851E403899F0E71BBFC0068D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_898B17970FF44FC29E21AE91B8283547 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1CCD65A7993341F9AD6B27914994AE25 }}

      - name: Configure project description generation
        shell: bash
        env:
          ATLAS_DESCRIPTION_TOKEN: ${{ secrets.ATLAS_DESCRIPTION_TOKEN }}
          ATLAS_HELPER_URL: https://rwc-atlas-chatbot-frh2gbaahydfc8cf.westus3-01.azurewebsites.net
        run: |
          if [[ -z "$ATLAS_DESCRIPTION_TOKEN" ]]; then
            exit 0
          fi
          group="$(az resource list --name rwc-atlas-api --resource-type Microsoft.Web/sites \
            --query "[?name=='rwc-atlas-api'].resourceGroup | [0]" --output tsv --only-show-errors)"
          if [[ -z "$group" ]]; then
            echo "Azure resource group for rwc-atlas-api not found."
            exit 1
          fi
          current_token="$(az webapp config appsettings list --name rwc-atlas-api --resource-group "$group" \
            --query "[?name=='ATLAS_DESCRIPTION_TOKEN'].value | [0]" --output tsv --only-show-errors)"
          current_helper="$(az webapp config appsettings list --name rwc-atlas-api --resource-group "$group" \
            --query "[?name=='ATLAS_HELPER_URL'].value | [0]" --output tsv --only-show-errors)"
          if [[ "$current_token" != "$ATLAS_DESCRIPTION_TOKEN" || "$current_helper" != "$ATLAS_HELPER_URL" ]]; then
            az webapp config appsettings set --name rwc-atlas-api --resource-group "$group" \
              --settings "ATLAS_DESCRIPTION_TOKEN=$ATLAS_DESCRIPTION_TOKEN" "ATLAS_HELPER_URL=$ATLAS_HELPER_URL" \
              --output none --only-show-errors
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: rwc-atlas-api
          slot-name: Production
          package: ${{ runner.temp }}/atlas-api.zip
          # App settings must include SCM_DO_BUILD_DURING_DEPLOYMENT=true.
          startup-command: python -m uvicorn main:app --host 0.0.0.0 --port 8000
