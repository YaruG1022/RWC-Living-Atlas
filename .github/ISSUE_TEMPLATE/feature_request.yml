name: Feature request
description: Propose a user-facing improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this, and what task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome and any relevant examples or alternatives.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results that would make this feature complete.
      placeholder: |
        - [ ] A user can ...
        - [ ] Existing behavior ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, dependencies, and risks
      description: Note what is outside this request and any data, accessibility, service, or configuration implications.
