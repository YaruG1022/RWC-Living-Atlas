[build]
base = "LivingAtlas1-main/client"
command = "CI=false npm run build"
publish = "build"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/manual/current.json"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/manual/releases/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
