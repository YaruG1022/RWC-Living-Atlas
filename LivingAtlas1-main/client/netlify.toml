[build]
command = "CI=false npm run build"
publish = "build"

[build.environment]
NODE_VERSION = "22.17.0"
NPM_FLAGS = "--ignore-scripts --no-audit --no-fund"
REACT_APP_CHATBOT_API_URL = "https://rwc-living-atlas-chatbot.onrender.com"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/manual/current.json"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/manual/releases/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
